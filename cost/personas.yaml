# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2. Nhóm Aliba6 · Track D2.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

# Quy mô ngoại suy tiềm năng; giả định toàn bộ quy mô này dùng mỗi tháng để stress-test.
# Không phải người dùng thực tế hoặc MAU của sản phẩm; xem cost-estimate.md.
users:
  low: 4648178
  base: 7090909
  high: 9209302
  source: "Vietdata 24/12/2023: hơn 12 triệu người dùng nền tảng giao đồ ăn năm 2023; lấy mốc 12.000.000 × 13/22 = 7.090.909. Thấp/cao: dải tham chiếu Wilson 95% của 13/22, không bảo đảm bao phủ quốc gia vì mẫu thuận tiện. Nguồn: https://www.vietdata.vn/post/ngành-giao-đồ-ăn-trực-tuyến-tại-việt-nam-baemin-rời-khỏi-thị-trường-sau-4-năm-thua-lỗ ; xem cost/cost-estimate.md."

personas:           # chia theo câu 3 khảo sát (số lần đặt hộ / tháng) trên 13 người trả lời "Có" ở câu 2
  - name: dat_ho_it
    share: 0.62             # 8/13 người ghi 1–3 lần
    uses_per_month: 2       # trung vị các câu trả lời 1, 1, 1-2, 2, 2, 2, 2-3, 3
    turns_per_session: 1    # gõ một lần là ra giỏ
    source: "khảo sát N=22, câu 3, 8/13 người (results.csv, count.py); turns: (tự ước tính)"
  - name: dat_ho_vua
    share: 0.23             # 3/13 người ghi 4–5 lần
    uses_per_month: 4.5     # câu trả lời 4, 4-5, 5
    turns_per_session: 2    # gõ lại một lần khi đổi ràng buộc / ngân sách
    source: "khảo sát N=22, câu 3, 3/13 người; turns: (tự ước tính)"
  - name: dat_ho_nhieu
    share: 0.15             # 2/13 người ghi ≥6 lần
    uses_per_month: 13.5    # trung bình hai câu trả lời 7 và 20 — n = 2, rất ít, chỉ để có kịch bản người dùng nặng
    turns_per_session: 2    # (tự ước tính)
    source: "khảo sát N=22, câu 3, 2/13 người (7 lần, 20 lần); turns: (tự ước tính)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).

# Model đã chốt: deepseek-flash cho cả run-2 (run-2@20261128-092542) và simulate-2 (simulate-2@20261128-113825).
# run-1 và simulate-1 chạy bằng qwen/qwen3.5-flash:free (endpoint xkiro) — không dùng để tính chi phí.
# Token đo bằng deepseek-flash; giá peak/cache-miss để dự toán thận trọng.
# Không gọi deepseek-v4-pro: chỉ quy đổi giá trên token flash, giữ cùng tỉ lệ đạt như một giả định.
prices:
  - model: deepseek-flash
    input: 0.30
    output: 1.20
    source: "https://api-docs.deepseek.com/quick_start/pricing/ ; kiểm 28/11/2026; peak/cache-miss, không phải hoá đơn thực trả."
  - model: deepseek-v4-pro
    input: 1.32
    output: 3.96
    source: "https://api-docs.deepseek.com/quick_start/pricing/ ; kiểm 28/11/2026; peak/cache-miss; quy đổi từ token flash, chưa đo tỉ lệ đạt của pro."

usd_to_vnd:         # tuỳ chọn: chưa điền vì BTC không chốt tỷ giá chung, nhóm chưa ghi nguồn tỷ giá
  rate:
  source:
